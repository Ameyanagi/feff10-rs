[package]
name = "feff10-cli"
edition.workspace = true
version.workspace = true
description = "CLI for running FEFF10 calculations"
license.workspace = true

[[bin]]
name = "feff10-rs"
path = "src/main.rs"

[features]
prebuilt = ["feff10/prebuilt"]

[dependencies]
feff10 = { path = "../feff10" }
feff10-sys = { path = "../feff10-sys" }
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
