[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "feff10-rs"
dynamic = ["version"]
description = "Python bindings for FEFF10 X-ray absorption spectroscopy calculations"
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.9"
keywords = ["feff", "xas", "exafs", "xanes", "spectroscopy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Ameyanagi/feff10-rs"
Repository = "https://github.com/Ameyanagi/feff10-rs"
"Bug Tracker" = "https://github.com/Ameyanagi/feff10-rs/issues"

[project.optional-dependencies]
numpy = ["numpy>=1.20"]
pandas = ["numpy>=1.20", "pandas>=1.3"]
dev = ["pytest>=7.0"]
docs = ["mkdocs-material>=9.0"]

[tool.maturin]
features = ["pyo3/extension-module", "pyo3/abi3-py39"]
python-source = "python"
module-name = "feff10._feff10"
