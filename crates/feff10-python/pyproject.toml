[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "feff10"
version = "0.1.0"
description = "Python bindings for FEFF10 X-ray absorption spectroscopy calculations"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.9"
keywords = ["feff", "xas", "exafs", "xanes", "spectroscopy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = []

[project.optional-dependencies]
numpy = ["numpy>=1.20"]
pandas = ["numpy>=1.20", "pandas>=1.3"]
dev = ["pytest>=7.0"]
docs = ["mkdocs-material>=9.0"]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "feff10._feff10"
