site_name: feff10
site_description: Python bindings for FEFF10 X-ray absorption spectroscopy calculations
repo_url: https://github.com/Ameyanagi/feff10-rs
repo_name: Ameyanagi/feff10-rs

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation: installation.md
  - User Guide:
      - Input Files: guide/input.md
      - Running Calculations: guide/pipeline.md
      - Parsing Output: guide/output.md
  - API Reference:
      - Overview: api/index.md
      - Input: api/input.md
      - Pipeline: api/pipeline.md
      - Output: api/output.md
