name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.0). If empty, creates a draft.'
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # --- Linux: ifx + MKL via Intel oneAPI Docker ---
  build-linux:
    runs-on: ubuntu-latest
    container: intel/oneapi-hpckit:2024.0.1-devel-ubuntu22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          # Skip apt-get update to avoid Intel GPU repo GPG key issues
          apt-get install -y make 2>/dev/null || true
          which make

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build
        env:
          FEFF_FC: /opt/intel/oneapi/compiler/latest/bin/ifx
          FEFF_NO_NATIVE: "1"
        run: cargo build --release -p feff10-cli

      - name: Test EXAFS/Cu
        id: test-exafs-cu
        run: |
          target/release/feff10-rs run feff10/examples/EXAFS/Cu -w /tmp/test-exafs-cu
          target/release/feff10-rs compare /tmp/test-exafs-cu/xmu.dat feff10/examples/EXAFS/Cu/referencexmu.dat

      - name: Test XANES/Cu
        id: test-xanes-cu
        run: |
          target/release/feff10-rs run feff10/examples/XANES/Cu -w /tmp/test-xanes-cu
          target/release/feff10-rs compare /tmp/test-xanes-cu/xmu.dat feff10/examples/XANES/Cu/referencexmu.dat

      - name: Test XANES/BN
        id: test-xanes-bn
        run: |
          target/release/feff10-rs run feff10/examples/XANES/BN -w /tmp/test-xanes-bn
          target/release/feff10-rs compare /tmp/test-xanes-bn/xmu.dat feff10/examples/XANES/BN/referencexmu.dat

      - name: Test summary
        if: always()
        run: |
          echo "### Linux (ifx + MKL)" > test-report-linux.md
          echo "- EXAFS/Cu: ${{ steps.test-exafs-cu.outcome }}" >> test-report-linux.md
          echo "- XANES/Cu: ${{ steps.test-xanes-cu.outcome }}" >> test-report-linux.md
          echo "- XANES/BN: ${{ steps.test-xanes-bn.outcome }}" >> test-report-linux.md
          cat test-report-linux.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-linux
          path: test-report-linux.md

      - name: Package
        run: |
          cp target/release/feff10-rs feff10-linux-x86_64
          chmod +x feff10-linux-x86_64
          # Extract libfeff10.a for library distribution
          libfeff10=$(find target/release/build/feff10-sys-*/out -name 'libfeff10.a' -print -quit)
          cp "$libfeff10" libfeff10-linux-x86_64.a

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: feff10-linux-x86_64
          path: |
            feff10-linux-x86_64
            libfeff10-linux-x86_64.a
          if-no-files-found: error

  # --- Linux compact: gfortran (no ifx/MKL required) ---
  build-linux-compact:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y gfortran make

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        env:
          FEFF_FC: gfortran
          FEFF_NO_NATIVE: "1"
        run: cargo build --release -p feff10-cli

      - name: Test EXAFS/Cu
        id: test-exafs-cu
        run: |
          target/release/feff10-rs run feff10/examples/EXAFS/Cu -w /tmp/test-exafs-cu
          target/release/feff10-rs compare /tmp/test-exafs-cu/xmu.dat feff10/examples/EXAFS/Cu/referencexmu.dat

      - name: Test XANES/Cu
        id: test-xanes-cu
        run: |
          target/release/feff10-rs run feff10/examples/XANES/Cu -w /tmp/test-xanes-cu
          target/release/feff10-rs compare /tmp/test-xanes-cu/xmu.dat feff10/examples/XANES/Cu/referencexmu.dat

      - name: Test XANES/BN
        id: test-xanes-bn
        run: |
          target/release/feff10-rs run feff10/examples/XANES/BN -w /tmp/test-xanes-bn
          target/release/feff10-rs compare /tmp/test-xanes-bn/xmu.dat feff10/examples/XANES/BN/referencexmu.dat

      - name: Test summary
        if: always()
        run: |
          echo "### Linux compact (gfortran, x86_64)" > test-report-linux-compact.md
          echo "- EXAFS/Cu: ${{ steps.test-exafs-cu.outcome }}" >> test-report-linux-compact.md
          echo "- XANES/Cu: ${{ steps.test-xanes-cu.outcome }}" >> test-report-linux-compact.md
          echo "- XANES/BN: ${{ steps.test-xanes-bn.outcome }}" >> test-report-linux-compact.md
          cat test-report-linux-compact.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-linux-compact
          path: test-report-linux-compact.md

      - name: Package
        run: |
          cp target/release/feff10-rs feff10-linux-x86_64-compact
          chmod +x feff10-linux-x86_64-compact
          libfeff10=$(find target/release/build/feff10-sys-*/out -name 'libfeff10.a' -print -quit)
          cp "$libfeff10" libfeff10-linux-x86_64-compact.a

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: feff10-linux-x86_64-compact
          path: |
            feff10-linux-x86_64-compact
            libfeff10-linux-x86_64-compact.a
          if-no-files-found: error

  # --- macOS ---
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install gfortran
        run: brew install gcc

      - name: Find gfortran
        id: fc
        run: |
          # brew installs gfortran as gfortran-NN, find the versioned name
          FC=$(ls /opt/homebrew/bin/gfortran-* /usr/local/bin/gfortran-* 2>/dev/null | head -1 || true)
          if [ -z "$FC" ]; then
            FC=$(which gfortran 2>/dev/null || true)
          fi
          if [ -z "$FC" ]; then
            echo "ERROR: gfortran not found"
            exit 1
          fi
          echo "fc=$FC" >> "$GITHUB_OUTPUT"
          echo "Found Fortran compiler: $FC"

      - name: Build
        env:
          FEFF_FC: ${{ steps.fc.outputs.fc }}
          FEFF_NO_NATIVE: "1"
        run: |
          # Add gfortran lib to linker search path
          FC_DIR=$(dirname "${{ steps.fc.outputs.fc }}")
          LIB_DIR=$(cd "$FC_DIR/../lib/gcc/current" 2>/dev/null && pwd || echo "")
          if [ -z "$LIB_DIR" ]; then
            LIB_DIR=$("${{ steps.fc.outputs.fc }}" -print-file-name=libgfortran.dylib | xargs dirname)
          fi
          echo "LIBRARY_PATH=$LIB_DIR" >> "$GITHUB_ENV"
          export LIBRARY_PATH="$LIB_DIR"
          echo "Using LIBRARY_PATH=$LIB_DIR"
          cargo build --release -p feff10-cli

      - name: Test EXAFS/Cu
        id: test-exafs-cu
        run: |
          target/release/feff10-rs run feff10/examples/EXAFS/Cu -w /tmp/test-exafs-cu
          target/release/feff10-rs compare /tmp/test-exafs-cu/xmu.dat feff10/examples/EXAFS/Cu/referencexmu.dat

      - name: Test XANES/Cu
        id: test-xanes-cu
        run: |
          target/release/feff10-rs run feff10/examples/XANES/Cu -w /tmp/test-xanes-cu
          target/release/feff10-rs compare /tmp/test-xanes-cu/xmu.dat feff10/examples/XANES/Cu/referencexmu.dat

      - name: Test XANES/BN
        id: test-xanes-bn
        run: |
          target/release/feff10-rs run feff10/examples/XANES/BN -w /tmp/test-xanes-bn
          target/release/feff10-rs compare /tmp/test-xanes-bn/xmu.dat feff10/examples/XANES/BN/referencexmu.dat

      - name: Test summary
        if: always()
        run: |
          echo "### macOS (gfortran, arm64)" > test-report-macos.md
          echo "- EXAFS/Cu: ${{ steps.test-exafs-cu.outcome }}" >> test-report-macos.md
          echo "- XANES/Cu: ${{ steps.test-xanes-cu.outcome }}" >> test-report-macos.md
          echo "- XANES/BN: ${{ steps.test-xanes-bn.outcome }}" >> test-report-macos.md
          cat test-report-macos.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-macos
          path: test-report-macos.md

      - name: Package
        run: |
          cp target/release/feff10-rs feff10-macos-arm64
          chmod +x feff10-macos-arm64
          libfeff10=$(find target/release/build/feff10-sys-*/out -name 'libfeff10.a' -print -quit)
          cp "$libfeff10" libfeff10-macos-arm64.a

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: feff10-macos-arm64
          path: |
            feff10-macos-arm64
            libfeff10-macos-arm64.a
          if-no-files-found: error

  # --- Windows ---
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install msys2 and gfortran
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc-fortran make

      - name: Build
        shell: msys2 {0}
        env:
          FEFF_FC: gfortran
          FEFF_NO_NATIVE: "1"
        run: |
          export PATH="/c/Users/runneradmin/.cargo/bin:/mingw64/bin:$PATH"
          cargo build --release --target x86_64-pc-windows-gnu -p feff10-cli

      - name: Test summary
        shell: msys2 {0}
        run: |
          echo "### Windows (gfortran, x86_64)" > test-report-windows.md
          echo "- Build: success" >> test-report-windows.md
          echo "- Integration tests: skipped (no fork() — Fortran global state not isolated)" >> test-report-windows.md
          cat test-report-windows.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: test-report-windows
          path: test-report-windows.md

      - name: Package
        shell: msys2 {0}
        run: |
          cp target/x86_64-pc-windows-gnu/release/feff10-rs.exe feff10-windows-x86_64.exe
          # Bundle required MinGW DLLs (gfortran linked dynamically on Windows)
          for dll in libgfortran-5.dll libquadmath-0.dll libgcc_s_seh-1.dll libwinpthread-1.dll; do
            src=$(find /mingw64/bin -name "$dll" -print -quit)
            if [ -n "$src" ]; then
              cp "$src" .
              echo "Bundled: $dll"
            fi
          done
          libfeff10=$(find target/x86_64-pc-windows-gnu/release/build/feff10-sys-*/out -name 'libfeff10.a' -print -quit)
          cp "$libfeff10" libfeff10-windows-x86_64.a

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: feff10-windows-x86_64
          path: |
            feff10-windows-x86_64.exe
            libfeff10-windows-x86_64.a
            libgfortran-5.dll
            libquadmath-0.dll
            libgcc_s_seh-1.dll
            libwinpthread-1.dll
          if-no-files-found: error

  # --- Linux ARM64 ---
  build-linux-aarch64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y gfortran make

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        env:
          FEFF_FC: gfortran
          FEFF_NO_NATIVE: "1"
        run: cargo build --release -p feff10-cli

      - name: Test EXAFS/Cu
        id: test-exafs-cu
        run: |
          target/release/feff10-rs run feff10/examples/EXAFS/Cu -w /tmp/test-exafs-cu
          target/release/feff10-rs compare /tmp/test-exafs-cu/xmu.dat feff10/examples/EXAFS/Cu/referencexmu.dat

      - name: Test XANES/Cu
        id: test-xanes-cu
        run: |
          target/release/feff10-rs run feff10/examples/XANES/Cu -w /tmp/test-xanes-cu
          target/release/feff10-rs compare /tmp/test-xanes-cu/xmu.dat feff10/examples/XANES/Cu/referencexmu.dat

      - name: Test XANES/BN
        id: test-xanes-bn
        run: |
          target/release/feff10-rs run feff10/examples/XANES/BN -w /tmp/test-xanes-bn
          target/release/feff10-rs compare /tmp/test-xanes-bn/xmu.dat feff10/examples/XANES/BN/referencexmu.dat

      - name: Test summary
        if: always()
        run: |
          echo "### Linux (gfortran, aarch64)" > test-report-linux-aarch64.md
          echo "- EXAFS/Cu: ${{ steps.test-exafs-cu.outcome }}" >> test-report-linux-aarch64.md
          echo "- XANES/Cu: ${{ steps.test-xanes-cu.outcome }}" >> test-report-linux-aarch64.md
          echo "- XANES/BN: ${{ steps.test-xanes-bn.outcome }}" >> test-report-linux-aarch64.md
          cat test-report-linux-aarch64.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-linux-aarch64
          path: test-report-linux-aarch64.md

      - name: Package
        run: |
          cp target/release/feff10-rs feff10-linux-aarch64
          chmod +x feff10-linux-aarch64
          libfeff10=$(find target/release/build/feff10-sys-*/out -name 'libfeff10.a' -print -quit)
          cp "$libfeff10" libfeff10-linux-aarch64.a

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: feff10-linux-aarch64
          path: |
            feff10-linux-aarch64
            libfeff10-linux-aarch64.a
          if-no-files-found: error

  # --- macOS Intel ---
  build-macos-x86_64:
    runs-on: macos-15-intel
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install gfortran
        run: brew install gcc

      - name: Find gfortran
        id: fc
        run: |
          FC=$(ls /usr/local/bin/gfortran-* 2>/dev/null | head -1 || true)
          if [ -z "$FC" ]; then
            FC=$(which gfortran 2>/dev/null || true)
          fi
          if [ -z "$FC" ]; then
            echo "ERROR: gfortran not found"
            exit 1
          fi
          echo "fc=$FC" >> "$GITHUB_OUTPUT"
          echo "Found Fortran compiler: $FC"

      - name: Build
        env:
          FEFF_FC: ${{ steps.fc.outputs.fc }}
          FEFF_NO_NATIVE: "1"
        run: |
          FC_DIR=$(dirname "${{ steps.fc.outputs.fc }}")
          LIB_DIR=$(cd "$FC_DIR/../lib/gcc/current" 2>/dev/null && pwd || echo "")
          if [ -z "$LIB_DIR" ]; then
            LIB_DIR=$("${{ steps.fc.outputs.fc }}" -print-file-name=libgfortran.dylib | xargs dirname)
          fi
          echo "LIBRARY_PATH=$LIB_DIR" >> "$GITHUB_ENV"
          export LIBRARY_PATH="$LIB_DIR"
          echo "Using LIBRARY_PATH=$LIB_DIR"
          cargo build --release -p feff10-cli

      - name: Test EXAFS/Cu
        id: test-exafs-cu
        run: |
          target/release/feff10-rs run feff10/examples/EXAFS/Cu -w /tmp/test-exafs-cu
          target/release/feff10-rs compare /tmp/test-exafs-cu/xmu.dat feff10/examples/EXAFS/Cu/referencexmu.dat

      - name: Test XANES/Cu
        id: test-xanes-cu
        run: |
          target/release/feff10-rs run feff10/examples/XANES/Cu -w /tmp/test-xanes-cu
          target/release/feff10-rs compare /tmp/test-xanes-cu/xmu.dat feff10/examples/XANES/Cu/referencexmu.dat

      - name: Test XANES/BN
        id: test-xanes-bn
        run: |
          target/release/feff10-rs run feff10/examples/XANES/BN -w /tmp/test-xanes-bn
          target/release/feff10-rs compare /tmp/test-xanes-bn/xmu.dat feff10/examples/XANES/BN/referencexmu.dat

      - name: Test summary
        if: always()
        run: |
          echo "### macOS (gfortran, x86_64)" > test-report-macos-x86_64.md
          echo "- EXAFS/Cu: ${{ steps.test-exafs-cu.outcome }}" >> test-report-macos-x86_64.md
          echo "- XANES/Cu: ${{ steps.test-xanes-cu.outcome }}" >> test-report-macos-x86_64.md
          echo "- XANES/BN: ${{ steps.test-xanes-bn.outcome }}" >> test-report-macos-x86_64.md
          cat test-report-macos-x86_64.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-macos-x86_64
          path: test-report-macos-x86_64.md

      - name: Package
        run: |
          cp target/release/feff10-rs feff10-macos-x86_64
          chmod +x feff10-macos-x86_64
          libfeff10=$(find target/release/build/feff10-sys-*/out -name 'libfeff10.a' -print -quit)
          cp "$libfeff10" libfeff10-macos-x86_64.a

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: feff10-macos-x86_64
          path: |
            feff10-macos-x86_64
            libfeff10-macos-x86_64.a
          if-no-files-found: error

  # ============================================================
  # Smoke tests: download packaged artifacts and run on clean
  # runners (no Fortran compiler, no Rust, no build deps).
  # Validates that the released binary is truly self-contained.
  # ============================================================

  smoke-test-linux:
    needs: build-linux
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: feff10-linux-x86_64

      - name: Run CLI smoke tests
        run: |
          chmod +x feff10-linux-x86_64
          BIN=./feff10-linux-x86_64
          echo "=== version ==="
          $BIN --version
          echo "=== stages ==="
          $BIN stages
          echo "=== examples (list) ==="
          $BIN examples
          echo "=== examples (JSON) ==="
          $BIN --json examples
          echo "=== examples (copy) ==="
          $BIN examples exafs-cu -o /tmp/smoke-example
          test -f /tmp/smoke-example/feff.inp
          echo "=== validate ==="
          $BIN validate /tmp/smoke-example/feff.inp
          echo "=== init (non-interactive) ==="
          $BIN init -t exafs --edge K --element Cu -o /tmp/smoke-init/feff.inp
          test -f /tmp/smoke-init/feff.inp
          $BIN validate /tmp/smoke-init/feff.inp
          echo "=== run (EXAFS Cu from bundled example) ==="
          $BIN run /tmp/smoke-example -w /tmp/smoke-run
          echo "=== All smoke tests passed ==="

  smoke-test-linux-compact:
    needs: build-linux-compact
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: feff10-linux-x86_64-compact

      - name: Run CLI smoke tests
        run: |
          chmod +x feff10-linux-x86_64-compact
          BIN=./feff10-linux-x86_64-compact
          echo "=== version ==="
          $BIN --version
          echo "=== stages ==="
          $BIN stages
          echo "=== examples (list) ==="
          $BIN examples
          echo "=== examples (JSON) ==="
          $BIN --json examples
          echo "=== examples (copy) ==="
          $BIN examples exafs-cu -o /tmp/smoke-example
          test -f /tmp/smoke-example/feff.inp
          echo "=== validate ==="
          $BIN validate /tmp/smoke-example/feff.inp
          echo "=== init (non-interactive) ==="
          $BIN init -t exafs --edge K --element Cu -o /tmp/smoke-init/feff.inp
          test -f /tmp/smoke-init/feff.inp
          $BIN validate /tmp/smoke-init/feff.inp
          echo "=== run (EXAFS Cu from bundled example) ==="
          $BIN run /tmp/smoke-example -w /tmp/smoke-run
          echo "=== All smoke tests passed ==="

  smoke-test-macos:
    needs: build-macos
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: feff10-macos-arm64

      - name: Run CLI smoke tests
        run: |
          chmod +x feff10-macos-arm64
          BIN=./feff10-macos-arm64
          echo "=== version ==="
          $BIN --version
          echo "=== stages ==="
          $BIN stages
          echo "=== examples (list) ==="
          $BIN examples
          echo "=== examples (JSON) ==="
          $BIN --json examples
          echo "=== examples (copy) ==="
          $BIN examples exafs-cu -o /tmp/smoke-example
          test -f /tmp/smoke-example/feff.inp
          echo "=== validate ==="
          $BIN validate /tmp/smoke-example/feff.inp
          echo "=== init (non-interactive) ==="
          $BIN init -t exafs --edge K --element Cu -o /tmp/smoke-init/feff.inp
          test -f /tmp/smoke-init/feff.inp
          $BIN validate /tmp/smoke-init/feff.inp
          echo "=== run (EXAFS Cu from bundled example) ==="
          $BIN run /tmp/smoke-example -w /tmp/smoke-run
          echo "=== All smoke tests passed ==="

  smoke-test-windows:
    needs: build-windows
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: feff10-windows-x86_64

      - name: Run CLI smoke tests
        shell: bash
        run: |
          # DLLs are in the same directory as the exe
          export PATH="$(pwd):$PATH"
          BIN=./feff10-windows-x86_64.exe
          echo "=== version ==="
          $BIN --version
          echo "=== stages ==="
          $BIN stages
          echo "=== examples (list) ==="
          $BIN examples
          echo "=== examples (JSON) ==="
          $BIN --json examples
          echo "=== examples (copy) ==="
          $BIN examples exafs-sf6 -o "$TEMP/smoke-example"
          test -f "$TEMP/smoke-example/feff.inp"
          echo "=== validate ==="
          $BIN validate "$TEMP/smoke-example/feff.inp"
          echo "=== init (non-interactive) ==="
          $BIN init -t exafs --edge K --element Cu -o "$TEMP/smoke-init/feff.inp"
          test -f "$TEMP/smoke-init/feff.inp"
          $BIN validate "$TEMP/smoke-init/feff.inp"
          echo "=== All smoke tests passed ==="
          # Note: 'run' subcommand skipped on Windows (no fork() for Fortran isolation)

  smoke-test-linux-aarch64:
