  # ============================================================
  # Create GitHub Release
  # ============================================================

  release:
    needs: [build-linux, build-linux-compact, build-linux-aarch64, build-macos, build-macos-x86_64, build-windows, smoke-test-linux, smoke-test-linux-compact, smoke-test-linux-aarch64, smoke-test-macos, smoke-test-macos-x86_64, smoke-test-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Copy header
        run: cp crates/feff10-sys/include/feff10.h artifacts/

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum feff10-* lib* feff10.h > sha256sums.txt
          echo "=== SHA256 Checksums ==="
          cat sha256sums.txt

      - name: Verify checksums
        run: |
          cd artifacts
          sha256sum -c sha256sums.txt

      - name: Assemble test summary
        run: |
          echo "## Test Results" > release-body.md
          echo "" >> release-body.md
          for report in artifacts/test-report-*.md; do
            if [ -f "$report" ]; then
              cat "$report" >> release-body.md
              echo "" >> release-body.md
            fi
          done
          echo "## SHA256 Checksums" >> release-body.md
          echo '```' >> release-body.md
          cat artifacts/sha256sums.txt >> release-body.md
          echo '```' >> release-body.md
          echo ""
          echo "=== Release Body ==="
          cat release-body.md
          cat release-body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "draft=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=draft-$(date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"
            echo "draft=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate tag matches workspace version
        if: startsWith(steps.tag.outputs.tag, 'v')
        run: |
          CARGO_VERSION=$(python3 - <<'PY'
          import json
          import subprocess
          import sys

          meta = json.loads(
              subprocess.check_output(
                  ["cargo", "metadata", "--no-deps", "--format-version", "1"],
                  text=True,
              )
          )
          ws = set(meta["workspace_members"])
          versions = sorted({pkg["version"] for pkg in meta["packages"] if pkg["id"] in ws})
          if len(versions) != 1:
              print(f"ERROR: expected one workspace version, found: {versions}", file=sys.stderr)
              sys.exit(1)
          print(versions[0])
          PY
          )
          TAG_VERSION="${{ steps.tag.outputs.tag }}"
          TAG_VERSION="${TAG_VERSION#v}"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "ERROR: tag version '$TAG_VERSION' does not match workspace version '$CARGO_VERSION'"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          draft: ${{ steps.tag.outputs.draft }}
          generate_release_notes: true
          append_body: true
          body_path: release-body.md
          files: |
            artifacts/feff10-linux-x86_64
            artifacts/feff10-linux-x86_64-compact
            artifacts/feff10-linux-aarch64
            artifacts/feff10-macos-arm64
            artifacts/feff10-macos-x86_64
            artifacts/feff10-windows-x86_64.exe
            artifacts/libgfortran-5.dll
            artifacts/libquadmath-0.dll
            artifacts/libgcc_s_seh-1.dll
            artifacts/libwinpthread-1.dll
            artifacts/libfeff10-linux-x86_64.a
            artifacts/libfeff10-linux-x86_64-compact.a
            artifacts/libfeff10-linux-aarch64.a
            artifacts/libfeff10-macos-arm64.a
            artifacts/libfeff10-macos-x86_64.a
            artifacts/libfeff10-windows-x86_64.a
            artifacts/feff10.h
            artifacts/sha256sums.txt

  publish-crates:
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/publish.yml
    with:
      dry-run: false
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-python:
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/python-wheels.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    permissions:
      contents: read
      id-token: write
