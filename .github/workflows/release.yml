name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.0). If empty, creates a draft.'
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # --- Linux: ifx + MKL via Intel oneAPI Docker ---
  build-linux:
    runs-on: ubuntu-latest
    container: intel/oneapi-hpckit:2024.0.1-devel-ubuntu22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          # Skip apt-get update to avoid Intel GPU repo GPG key issues
          apt-get install -y make 2>/dev/null || true
          which make

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build
        env:
          FEFF_FC: ifx
          FEFF_NO_NATIVE: "1"
        run: cargo build --release -p feff10-cli

      - name: Package
        run: |
          staging="feff10-x86_64-unknown-linux-gnu"
          mkdir -p "$staging"
          cp target/release/feff10-cli "$staging/feff10"
          libfeff10=$(find target/release/build/feff10-sys-*/out -name 'libfeff10.a' -print -quit 2>/dev/null)
          if [ -n "$libfeff10" ]; then
            cp "$libfeff10" "$staging/"
            echo "Included libfeff10.a ($(du -h "$libfeff10" | cut -f1))"
          else
            echo "WARNING: libfeff10.a not found"
          fi
          tar czf "$staging.tar.gz" "$staging"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: feff10-x86_64-unknown-linux-gnu
          path: feff10-x86_64-unknown-linux-gnu.tar.gz
          if-no-files-found: error

  # --- macOS ---
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install gfortran
        run: brew install gcc

      - name: Find gfortran
        id: fc
        run: |
          # brew installs gfortran as gfortran-NN, find the versioned name
          FC=$(ls /opt/homebrew/bin/gfortran-* /usr/local/bin/gfortran-* 2>/dev/null | head -1 || true)
          if [ -z "$FC" ]; then
            FC=$(which gfortran 2>/dev/null || true)
          fi
          if [ -z "$FC" ]; then
            echo "ERROR: gfortran not found"
            exit 1
          fi
          echo "fc=$FC" >> "$GITHUB_OUTPUT"
          echo "Found Fortran compiler: $FC"

      - name: Build
        env:
          FEFF_FC: ${{ steps.fc.outputs.fc }}
          FEFF_NO_NATIVE: "1"
        run: |
          # Add gfortran lib to linker search path
          FC_DIR=$(dirname "${{ steps.fc.outputs.fc }}")
          LIB_DIR=$(cd "$FC_DIR/../lib/gcc/current" 2>/dev/null && pwd || echo "")
          if [ -z "$LIB_DIR" ]; then
            LIB_DIR=$("${{ steps.fc.outputs.fc }}" -print-file-name=libgfortran.dylib | xargs dirname)
          fi
          echo "LIBRARY_PATH=$LIB_DIR" >> "$GITHUB_ENV"
          export LIBRARY_PATH="$LIB_DIR"
          echo "Using LIBRARY_PATH=$LIB_DIR"
          cargo build --release -p feff10-cli

      - name: Package
        run: |
          staging="feff10-aarch64-apple-darwin"
          mkdir -p "$staging"
          cp target/release/feff10-cli "$staging/feff10"
          libfeff10=$(find target/release/build/feff10-sys-*/out -name 'libfeff10.a' -print -quit 2>/dev/null)
          if [ -n "$libfeff10" ]; then
            cp "$libfeff10" "$staging/"
            echo "Included libfeff10.a ($(du -h "$libfeff10" | cut -f1))"
          else
            echo "WARNING: libfeff10.a not found"
          fi
          tar czf "$staging.tar.gz" "$staging"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: feff10-aarch64-apple-darwin
          path: feff10-aarch64-apple-darwin.tar.gz
          if-no-files-found: error

  # --- Windows ---
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install msys2 and gfortran
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc-fortran make

      - name: Build
        shell: msys2 {0}
        env:
          FEFF_FC: gfortran
          FEFF_NO_NATIVE: "1"
        run: |
          export PATH="/c/Users/runneradmin/.cargo/bin:/mingw64/bin:$PATH"
          cargo build --release -p feff10-cli

      - name: Package
        shell: msys2 {0}
        run: |
          staging="feff10-x86_64-pc-windows-gnu"
          mkdir -p "$staging"
          cp target/release/feff10-cli.exe "$staging/feff10.exe"
          libfeff10=$(find target/release/build/feff10-sys-*/out -name 'libfeff10.a' -print -quit 2>/dev/null)
          if [ -n "$libfeff10" ]; then
            cp "$libfeff10" "$staging/"
            echo "Included libfeff10.a"
          else
            echo "WARNING: libfeff10.a not found"
          fi
          # Bundle MinGW runtime DLLs
          for dll in libgfortran-5.dll libgcc_s_seh-1.dll libwinpthread-1.dll libquadmath-0.dll; do
            dllpath="/mingw64/bin/$dll"
            if [ -f "$dllpath" ]; then
              cp "$dllpath" "$staging/"
              echo "Bundled $dll"
            fi
          done
          7z a "$staging.zip" "$staging"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: feff10-x86_64-pc-windows-gnu
          path: feff10-x86_64-pc-windows-gnu.zip
          if-no-files-found: error

  release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum feff10-*.tar.gz feff10-*.zip > sha256sums.txt
          echo "=== SHA256 Checksums ==="
          cat sha256sums.txt

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "draft=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=draft-$(date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"
            echo "draft=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          draft: ${{ steps.tag.outputs.draft }}
          generate_release_notes: true
          files: |
            artifacts/feff10-*.tar.gz
            artifacts/feff10-*.zip
            artifacts/sha256sums.txt
