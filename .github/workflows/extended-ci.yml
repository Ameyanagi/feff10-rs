name: Extended CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

concurrency:
  group: extended-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: ifx
            experimental: true
          - os: macos-latest
            compiler: gfortran
          - os: windows-latest
            compiler: gfortran

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.experimental || false }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Windows GNU target
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-gnu

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: extended-${{ runner.os }}-${{ matrix.compiler }}

      - name: Install gfortran (macOS)
        if: matrix.compiler == 'gfortran' && runner.os == 'macOS'
        run: brew install gcc

      - name: Find gfortran (macOS)
        if: matrix.compiler == 'gfortran' && runner.os == 'macOS'
        id: macos-gfortran
        run: |
          FC=""
          for candidate in "$(brew --prefix gcc)"/bin/gfortran-*; do
            if [ -x "$candidate" ]; then
              FC="$candidate"
              break
            fi
          done
          if [ -z "$FC" ]; then
            echo "ERROR: gfortran not found"
            exit 1
          fi
          echo "fc=$FC" >> "$GITHUB_OUTPUT"

      - name: Install gfortran (Windows)
        if: matrix.compiler == 'gfortran' && runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc-fortran make

      - name: Install Intel Fortran (ifx)
        if: matrix.compiler == 'ifx'
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: intel
          version: '2024.0'

      - name: Resolve ifx compiler path
        if: matrix.compiler == 'ifx'
        id: ifx-path
        run: |
          FC=$(which ifx)
          if [ -z "$FC" ]; then
            echo "ERROR: ifx not found"
            exit 1
          fi
          echo "fc=$FC" >> "$GITHUB_OUTPUT"

      - name: Set compiler env
        if: runner.os != 'Windows'
        id: compiler-env
        run: |
          case "${{ matrix.compiler }}" in
            gfortran)
              FC="${{ steps.macos-gfortran.outputs.fc }}"
              FC_DIR=$(dirname "$FC")
              LIB_DIR=$(cd "$FC_DIR/../lib/gcc/current" 2>/dev/null && pwd || echo "")
              if [ -z "$LIB_DIR" ]; then
                LIB_DIR=$("$FC" -print-file-name=libgfortran.dylib | xargs dirname)
              fi
              echo "library_path=$LIB_DIR" >> "$GITHUB_OUTPUT"
              ;;
            ifx)
              FC="${{ steps.ifx-path.outputs.fc }}"
              ;;
          esac
          echo "fc=$FC" >> "$GITHUB_OUTPUT"

      - name: Build
        if: runner.os != 'Windows'
        env:
          FEFF_FC: ${{ steps.compiler-env.outputs.fc }}
          LIBRARY_PATH: ${{ steps.compiler-env.outputs.library_path }}
        run: cargo build --workspace

      - name: Unit tests
        if: runner.os != 'Windows'
        env:
          FEFF_FC: ${{ steps.compiler-env.outputs.fc }}
          LIBRARY_PATH: ${{ steps.compiler-env.outputs.library_path }}
        run: cargo test --workspace --lib

      - name: Integration tests
        if: runner.os != 'Windows'
        env:
          FEFF_FC: ${{ steps.compiler-env.outputs.fc }}
          LIBRARY_PATH: ${{ steps.compiler-env.outputs.library_path }}
        run: cargo test -p feff10 --test integration -- --test-threads=1
        timeout-minutes: 30

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          FEFF_FC: gfortran
        run: |
          export PATH="/c/Users/runneradmin/.cargo/bin:/mingw64/bin:$PATH"
          cargo build --workspace --target x86_64-pc-windows-gnu

      - name: Unit tests (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          export PATH="/c/Users/runneradmin/.cargo/bin:/mingw64/bin:$PATH"
          cargo test --workspace --lib --target x86_64-pc-windows-gnu

      - name: Worker isolation and Cu path regression
        if: runner.os != 'Windows'
        env:
          FEFF_FC: ${{ steps.compiler-env.outputs.fc }}
          LIBRARY_PATH: ${{ steps.compiler-env.outputs.library_path }}
        run: cargo test -p feff10 --test worker_mode

      - name: Worker isolation and Cu path regression (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          FEFF_FC: gfortran
        run: |
          export PATH="/c/Users/runneradmin/.cargo/bin:/mingw64/bin:$PATH"
          cargo test -p feff10 --target x86_64-pc-windows-gnu --test worker_mode

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test installed Python wheel
        if: runner.os != 'Windows'
        run: bash scripts/test-python.sh

      - name: Test installed Python wheel (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          export PATH="/c/Users/runneradmin/.cargo/bin:/mingw64/bin:$PATH"
          bash scripts/test-python.sh x86_64-pc-windows-gnu
