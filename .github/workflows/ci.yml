name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    needs: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran make

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        env:
          FEFF_FC: gfortran
        run: cargo clippy --workspace --all-targets -- -D warnings

  build-and-test:
    needs: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran make

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build
        env:
          FEFF_FC: gfortran
        run: cargo build --workspace

      - name: Unit tests
        env:
          FEFF_FC: gfortran
        run: cargo test --workspace --lib

      - name: Integration tests
        env:
          FEFF_FC: gfortran
        run: cargo test -p feff10 --test integration -- --test-threads=1
        timeout-minutes: 30

      - name: Worker isolation and Cu path regression
        env:
          FEFF_FC: gfortran
        run: cargo test -p feff10 --test worker_mode

      - name: Test prebuilt feature
        run: |
          set -euo pipefail
          library=$(find target/debug/build/feff10-sys-*/out -name 'libfeff10.a' -print -quit)
          libdir=$(cd "$(dirname "$library")" && pwd)
          echo "Using prebuilt lib from: $libdir"
          FEFF10_LIB_DIR="$libdir" cargo test -p feff10 --features prebuilt --test worker_mode
