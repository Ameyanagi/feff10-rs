name: Publish to crates.io

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run (do not actually publish)'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      dry-run:
        required: false
        default: false
        type: boolean
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify packaging (feff10-sys)
        run: cargo publish --dry-run -p feff10-sys

      - name: Verify packaging (feff10)
        run: cargo publish --dry-run -p feff10

      - name: Verify packaging (feff10-cli)
        run: cargo publish --dry-run -p feff10-cli

      - name: Publish feff10-sys
        if: ${{ !inputs.dry-run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p feff10-sys

      - name: Wait for crates.io index update
        if: ${{ !inputs.dry-run }}
        run: |
          echo "Waiting 30s for crates.io index propagation..."
          sleep 30

      - name: Publish feff10
        if: ${{ !inputs.dry-run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for i in 1 2 3 4 5; do
            cargo publish -p feff10 && break
            echo "Attempt $i failed, waiting 15s for index propagation..."
            sleep 15
          done

      - name: Wait for crates.io index update
        if: ${{ !inputs.dry-run }}
        run: |
          echo "Waiting 30s for crates.io index propagation..."
          sleep 30

      - name: Publish feff10-cli
        if: ${{ !inputs.dry-run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for i in 1 2 3 4 5; do
            cargo publish -p feff10-cli && break
            echo "Attempt $i failed, waiting 15s for index propagation..."
            sleep 15
          done
