name: Publish to crates.io

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run (do not actually publish)'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      dry-run:
        required: false
        default: false
        type: boolean
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify packaging (feff10-sys)
        run: cargo publish --dry-run -p feff10-sys

      - name: Publish feff10-sys
        if: ${{ !inputs.dry-run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p feff10-sys

      - name: Publish feff10
        if: ${{ !inputs.dry-run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            if cargo publish -p feff10; then
              exit 0
            fi
            if [ "$attempt" -eq 8 ]; then
              echo "Failed to publish feff10 after $attempt attempts" >&2
              exit 1
            fi
            echo "Attempt $attempt failed, waiting 30s for index propagation..."
            sleep 30
          done

      - name: Publish feff10-cli
        if: ${{ !inputs.dry-run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            if cargo publish -p feff10-cli; then
              exit 0
            fi
            if [ "$attempt" -eq 8 ]; then
              echo "Failed to publish feff10-cli after $attempt attempts" >&2
              exit 1
            fi
            echo "Attempt $attempt failed, waiting 30s for index propagation..."
            sleep 30
          done
